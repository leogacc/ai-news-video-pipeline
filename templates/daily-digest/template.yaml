# Daily Digest — the main template (current daily pipeline, as of v2026.10.23.10)
# Status: live. This documents the format the 18:00 PT daily run actually ships.
# The run itself still reads pipeline/config.yaml and pipeline/*.py — this file
# is the template definition, not yet a runtime input. Wire it in only on approval.
id: daily-digest
name: Daily Digest
is_main: true
pipeline_version_documented: 2026.10.23.10

format:
  width: 1080
  height: 1920
  aspect: "9:16"
  fps: 30
  codec: h264
  profile: high
  level: 4.0
  pix_fmt: yuv420p
  faststart: true
  loudness_lufs: -14

content:
  stories: 5
  order: most-interesting-first
  structure:
    - hooks: 5 rapid headline cuts, one per story, ~2s each, kind=hook, each with story_id
    - self_plug: one branding line after the hooks, kind=hook, no story_id
      text: "This is a top five AI story digest. The digest starts now, follow to stay ahead, the extended version and quick cuts are at the link in bio"
    - deep_dives: 1-2 segments per story, kind=story, ~55-70 words each, 3-4 distinct facts, never restating the headline
  words_total: [300, 450]
  reading_level_max: 9.5  # Flesch-Kincaid
  duration_target_seconds: ~164

style:
  captions:
    style: terminal per-letter typewriter, trailing block cursor
    color: "#39FF14"
    background: pure black
    fade: 70px smoothstep at y 1380..1450
    text_top_y: 1450
  vertical_zones:
    rule: UNIFIED ZONES (2026-10-25, from the REA v2/v3 and GPU v4 fixes — same rule as templates/clips/template.yaml unified_vertical_zones, adapted to digest format). Frame 1080x1920. Captions are FIXED at the bottom (text_top_y 1450, first glyph row ~1521+) and never move; mid content is NEVER too high, so no shot may end its visual high and leave a black band above the captions.
    deep_dives_and_hooks: hook heroes and deep-dive visuals fill the frame. Padded / blur-pad shots extend their sharp visual down to y1490 — this supersedes any older y0..1400 sharp-image cap for deep-dive shots. Cover-fill shots fill the full frame.
    text_stacks: any title / bio / analytical text stack follows the clips stack rule — its bottom sits within ~25px of the first caption glyph row, never overlapping the captions, and never riding high in the frame.
    measurable_check: on final-render frames (hooks, each deep dive, self-plug), measure the bottom row of the lowest visual/text element against the first caption glyph row. FAIL the render if a deep-dive visual ends above y1400 or the gap to the captions exceeds ~60px — shift the visual down and re-render.
    self_plug_note: the self-plug montage is a sliding composite, not a static stack, so its window is judged by its full split shot, not by a single panel row — see self_plug_montage below.
  watermark:
    text: "@leos.logos"
    font: DejaVuSans-Bold, 34pt
    color: white at 50% opacity (ffmpeg fontcolor=white@0.5)
    position: top-left, x=60, y=190, rect [60,190,300,228] — same row centre (y~212) as the number pills, which sit upper-right, so the two never collide
    duration: every frame, whole video (burned in the final mux, render.py 2026-10-10) — never a single shot, never omitted
    check: visible on final-render stills at start, middle, and end; must not sit under platform UI or overlap captions
  number_pills:
    size: 138x66
    shape: rounded rectangle, dark, 50% transparent, clean blurred edge
    format: "n/5"
    position: upper-right, centred on W-198, 212
    behaviour: fade in once per story, stay solid through its shots; story-less hooks get none
  hooks:
    hero: most relevant source footage (showcase pic/video from the source, or cropped screenshot of the most credible source); person photo only as fallback; a hero previewing its deep-dive article is intentional, not a duplicate
  self_plug_montage:
    type: split
    layout: left side characters, right side company/icon logos
    logos_from: script.json story_ids -> story_icons (glyphs are drawn icons, not missing-logo fallbacks)
    motion: simply slides top-to-bottom over the tall split composite, then holds the full split shot with all pairs at once
    rows: crop ONLY each character's own panel band, never a square face crop that pulls in neighbouring panels
    cover_fill: never — self-plug clips stay in y 0..1490, above the captions (first glyph row ~1521+), so the full split shot fills down toward the captions instead of ending high at y1400; the caption fade sits just above the captions, not as a hard cut at 1400
  portrait:
    type: Pixar-style group portrait, 9:16, top-to-bottom story order
    attire: each character in a DIFFERENT outfit, never all in dark suits
    background: relevant per character (not pure black)
    aspect_check: width/height <= 0.85, renderer fails loud on landscape
  voice:
    engine: Kokoro
    voice: am_echo
    speed: 1.20
  music: off  # temporary, user 2026-10-23; track preserved as .disabled, never add a copyrighted song

visual_rules:
  - verified pins outrank all other sources; pin both .jpg and .png for vision-cropped document/X shots
  - no Commons ever; stock is illustrative generic-action b-roll only
  - broll queries describe literally visible things, never metaphors
  - no repeated pages/images/clips (same-URL skip, dHash <=12/256, clip byte-hash)
  - no black frames, no generic news-list screenshots, no verification/CAPTCHA/paywall/ad walls
  - no full-frame company logos in deep dives
  - evidence cannot appear before its subject is spoken; visual changes align with narration/story starts
  - analytical text above the caption zone; no mid-screen text without an analytical chart
  - visual zone fills to the captions (see style.vertical_zones): no deep-dive shot ends its visual above y1490 leaving a black band above the captions; mid content is never too high

publish:
  mode: telegram_queue
  tiktok_description:
    format: "Here are the five biggest AI stories for {Day, Month Date with ordinal}: [5 clauses, ', and' before last]. [1-2 engagement questions hooked on story #1]\n[exactly 5 hashtags as the FINAL line]"
    never_claim_to_be_ai: true
    sent_to_telegram_with_video: true
  dedupe: never repeat stories already shared (pipeline/state.json posted_ids)
