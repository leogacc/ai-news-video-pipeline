name: weekly-longform
# Sunday 08:00 PT = 15:00 UTC. Staggered 2h after the daily short so the two
# never race on state.json (dedupe log). Renders the 16:9 weekly roundup (~30-60 min).
on:
  # schedule DISABLED 2026-10-07 — VM branch is primary; kept as fallback infra
  # via manual dispatch. To re-enable: uncomment the schedule block below.
  #schedule:
  #  - cron: "0 15 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install CPU-only torch (kokoro dependency)
        run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install Python deps
        run: pip install -q -r pipeline/requirements.txt

      - name: Restore b-roll cache
        uses: actions/cache@v4
        with:
          path: pipeline/cache/clips
          key: broll-${{ hashFiles('pipeline/cache/manifest.txt') }}
          restore-keys: broll-

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH_MODE: telegram_queue
        run: python pipeline/run.py --mode weekly

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-longform-${{ github.run_id }}
          path: pipeline/output/ainews_weekly.mp4
          retention-days: 7

      - name: Commit state (dedupe log + defeats 60-day schedule auto-disable)
        if: success()
        run: |
          git config user.name "pipeline-bot"
          git config user.email "pipeline-bot@users.noreply.github.com"
          git add pipeline/state.json
          git diff --cached --quiet || git commit -m "weekly run $(date -u +%F)"
          git push
