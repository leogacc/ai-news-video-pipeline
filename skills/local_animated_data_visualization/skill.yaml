  rationale: 'The run brief lists 21 active learned skills, which triggers the consolidation rule. Three of them teach the same craft under different names: local_animated_infographic (staggered icon pops, eased count-up key numbers, draw-on connectors, Remotion stills-verify loop), local_chart_animation (bar chart races, eased count-ups with rounded Intl.NumberFormat tabular-nums, frame-driven values, stills-verify loop), and local_diagram_animation (node/edge/label reveals, draw-on edges, count-ups, bar/line chart recipes). Their SKILL.md bodies repeat the same mechanisms: drive every value from the current frame, round before formatting, ease the value not just the opacity, and verify with frozen frames before encoding. The infographic skill even points at chart-animation for heavy charting, so the boundary is artificial and splits discovery for one kind of request. Merging them into one broader skill removes the near-duplicate trigger phrases while preserving every distinct method (composed infographics, data-driven charts, diagram reveals, web and video build tools) and keeps the runnable recipes reachable via the retired folders on disk. Deterministic candidates were reviewed and rejected: the repeated_handoff_suppression candidates target objective-loop trigger cadence/policy and the goals_bookkeeping recurring_failure targets the objective-loop prompt, both system surfaces this loop never changes. The 7 new audit-worthy runs show healthy operation (muse-video-pipeline-daily run ca39a2c4-e638-46dd-9da8-3b356a8649bc succeeded; the two user correction waves landed as versioned pipeline upgrades v2026.10.18.2/3 through the existing local-pipeline-upgrade skill; the 2026-10-19 portrait-generator outage was handled per the standing ship-degraded-and-name-it rule). The 27 subagent/tool failures carry no error text in the packet and deeper reads (muse.db, muse.exec) were denied by tool policy, so no skill-attributable pattern could be grounded and no new skill is proposed from them.'
