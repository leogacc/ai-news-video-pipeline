# Scout master keyword list — search for everything AI (runs on X AND on Threads from 2026-10-26)
# Created 2026-10-24, user: "stay general in the AI space" (not hacks).
# This list is the scout's search pool. The scout SAVES what it finds to
# scout/saved_items.json, and ALL downstream pipelines (daily digest,
# clips, rumors digest) retrieve their data from that saved pool first,
# before doing any of their own searching.
#
# How to use it:
# - Run the combined search_queries below (one per search), plus the
#   account list in scout/accounts.yaml, each scout run — on X, and
#   from 2026-10-26 also on Threads via threads-cli search (see
#   scout/README.md "How Threads is accessed").
# - Search the last 24h first, then widen only if a run comes back empty.
# - A keyword hit is NOT a story by itself — it must be a notable post
#   (new model, launch, paper, demo, tool, company move, or credible
#   rumor) with a source post + date + author. Skip hype, memes, and
#   engagement bait, and log why in the run report.
# - Do NOT use hack-specific terms (jailbreak, unlock, crack, bypass) as
#   primary search terms. If a general find happens to be an unlock or
#   workaround, classify it as a FIND, label its benchmarks as claimed
#   by its author, and do not call the category Hacks.

categories:
  - releases   # official announcements: launches, models, products, papers from the lab/company itself
  - rumors     # unconfirmed: leaks, reportedly, sources say, upcoming — always labelled as rumor
  - finds      # GENERAL AI finds: community tools, demos, projects, research, benchmarks, clever uses — not official releases, not rumors, not hacks as a category

