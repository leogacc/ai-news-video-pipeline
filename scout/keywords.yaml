# Combined X search queries — run these, not every keyword alone.
# "AI" alone is too noisy; pair a core term with a signal term.
search_queries:
  - "(AI OR LLM OR artificial intelligence) (new model OR model release OR just released OR unveiled OR announced)"
  - "(OpenAI OR Anthropic OR Claude OR Gemini OR DeepMind OR xAI OR Grok OR Meta AI OR DeepSeek OR Qwen OR Mistral) (launch OR release OR model OR announcement OR announcing)"
  - "(AI agent OR agentic OR autonomous agent OR coding agent OR computer use) (launch OR demo OR tool OR release)"
  - "(video generation OR image generation OR voice AI OR speech model OR robotics OR humanoid) (new OR launch OR demo OR model)"
  - "(arXiv OR paper OR research OR breakthrough OR benchmark OR SOTA) (AI OR LLM OR model)"
  - "(open source OR GitHub OR open weights) (AI OR LLM OR model OR tool)"
  - "(AI OR LLM) (funding OR acquisition OR startup OR IPO OR lawsuit OR regulation OR safety)"
  - "(AI OR LLM) (leak OR leaked OR reportedly OR rumor OR upcoming OR exclusive)"
  - "(GPU OR AI chip OR inference OR training) (AI OR NVIDIA OR model)"
  - "(AI tool OR new tool OR just built OR demo OR showcase) (AI OR LLM)"
  - "(TFLOPS OR PyTorch OR vLLM OR Tensor Core OR FP16 OR BF16) (GPU OR NVIDIA OR RTX OR AI)"
  # Added 2026-10-26 (user: "add a market-moving AI news query"): AI market
  # moves — bubbles, crashes, selloffs. This is AI market NEWS, not
  # stock-price tips, so it sits outside the excluded_as_primary
  # "stock price" noise rule below.
  - "(AI OR semiconductor) (bubble OR burst OR crash OR plunge OR meltdown OR selloff) (stocks OR market OR index)"
  # Added 2026-10-26 (user: "add more keywords", after the scout missed
  # Greg Brockman's Oct 26 OpenAI science-discoveries post): the old
  # queries only matched model/tool/release/paper vocabulary, so an
  # announcement worded as "Announcing ... discoveries" fell through.
  - "(AI OR LLM OR OpenAI OR Anthropic OR DeepMind OR Meta AI OR xAI) (discovery OR discoveries OR theorem OR proof OR scientific)"
  - "(AI OR LLM) (discovers OR discovered OR solves OR solved OR proves OR proved)"

# What NOT to search as primary terms (noise / out of scope):
excluded_as_primary:
  - jailbreak
  - unlock
  - crack
  - bypass
  - crypto
  - stock price
  - meme
  - giveaway
